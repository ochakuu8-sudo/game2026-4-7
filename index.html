<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DigDig Miner ⛏️</title>
<style>
  :root {
    --dirt1: #6b3a1f;
    --dirt2: #8b4513;
    --dirt3: #5a2e0a;
    --cell-size: 36px;
    --border-radius: 4px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0d0804;
    font-family: 'Arial Black', Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 8px 8px 6px;
    gap: 8px;
  }

  /* ── Header ── */
  #header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #1a0a00, #2d1500);
    border: 2px solid #5a3010;
    border-radius: 10px;
    padding: 6px 12px;
  }
  #title { font-size: 18px; letter-spacing: 1px; color: #f0a030; text-shadow: 0 0 8px #f0a03080; }
  #stats { display: flex; gap: 14px; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .stat-label { font-size: 9px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
  .stat-value { font-size: 17px; font-weight: bold; }
  #score-val { color: #4cf; text-shadow: 0 0 6px #4cf8; }
  #lives-val { color: #f44; text-shadow: 0 0 6px #f448; }
  #ores-val  { color: #4fc; text-shadow: 0 0 6px #4fc8; }

  /* ── Info bar ── */
  #infobar {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 11px;
    color: #aaa;
  }
  .legend { display: flex; align-items: center; gap: 4px; }
  .legend-num { font-weight: bold; font-size: 13px; }
  .leg-green { color: #3f8; }
  .leg-red   { color: #f54; }
  .leg-yellow{ color: #ff0; }

  /* ── Grid wrapper ── */
  #grid-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    width: 100%;
  }
  #grid {
    display: grid;
    gap: 2px;
    background: #1a0800;
    border: 3px solid #3d1f00;
    border-radius: 8px;
    padding: 4px;
  }

  /* ── Cells ── */
  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    border-radius: var(--border-radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    position: relative;
  }

  /* Covered / Dirt — not yet reachable (dark, uninteractable) */
  .cell.hidden {
    background:
      linear-gradient(135deg, #3a1c08, #311508, #281005, #341608);
    border-top: 2px solid #5a2e10;
    border-left: 2px solid #4e2808;
    border-bottom: 2px solid #1e0c02;
    border-right: 2px solid #1e0c02;
    box-shadow: inset 1px 1px 0 #5a3018, inset -1px -1px 0 #140802;
    cursor: default;
    filter: brightness(0.8);
  }

  /* Reachable dirt — can be dug now */
  .cell.hidden.reachable {
    background:
      radial-gradient(circle at 30% 30%, #b0631a 0%, transparent 50%),
      linear-gradient(135deg, #8a4e28, #7b4221, #6a3a1c, #8a4a24);
    border-top: 2px solid #d07830;
    border-left: 2px solid #c06828;
    border-bottom: 2px solid #4a2a10;
    border-right: 2px solid #4a2a10;
    box-shadow: inset 1px 1px 0 #d08040, inset -1px -1px 0 #3a2010;
    cursor: pointer;
    filter: none;
  }
  .cell.hidden.reachable:active { filter: brightness(0.75); }
  .cell.hidden.reachable::after {
    content: '';
    position: absolute;
    inset: 2px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,180,80,0.14) 0%, transparent 40%),
      repeating-linear-gradient(
        45deg,
        rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px,
        transparent 1px, transparent 6px
      );
    border-radius: 3px;
    pointer-events: none;
  }

  /* Revealed empty */
  .cell.revealed {
    background: linear-gradient(135deg, #1c0e04, #251205);
    border: 1px solid #3a1a06;
    font-size: 16px;
  }
  .cell.revealed.num-green  { color: #3f8; text-shadow: 0 0 6px #3f8a; }
  .cell.revealed.num-red    { color: #f54; text-shadow: 0 0 6px #f54a; }
  .cell.revealed.num-yellow { color: #ff0; text-shadow: 0 0 8px #ff08; }

  /* Ore — transform pulse is GPU-composited (no repaint) */
  .cell.ore {
    background: radial-gradient(circle at 40% 35%, #90ffe0, #00c880 40%, #007850);
    border: 2px solid #00ffaa;
    box-shadow: 0 0 8px #00ffaa80;
    font-size: 18px;
  }


  /* Bomb hit */
  .cell.bomb-hit {
    background: radial-gradient(circle, #ff8800, #ff2200 50%, #800000);
    border: 2px solid #ff4400;
    box-shadow: 0 0 12px #ff440099;
    font-size: 18px;
  }

  /* Bomb revealed (game over, not hit) */
  .cell.bomb-revealed {
    background: linear-gradient(135deg, #3a0808, #600000);
    border: 1px solid #aa2200;
    font-size: 17px;
    opacity: 0.85;
  }

  /* Flagged */
  .cell.flagged {
    background: linear-gradient(135deg, #5a3018, #4a2010);
    border-top: 2px solid #c06828;
    border-left: 2px solid #b05e22;
    border-bottom: 2px solid #3a1a06;
    border-right: 2px solid #3a1a06;
    font-size: 16px;
    cursor: pointer;
  }

  /* Ore collected (flash) */
  .cell.collected {
    background: radial-gradient(circle, #ffffaa, #ffff00, #80ff40);
    border: 2px solid #ffff00;
  }

  /* ── Buttons ── */
  #controls {
    width: 100%;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: 2px solid;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: filter 0.1s, transform 0.1s;
  }
  .btn:active { transform: scale(0.95); filter: brightness(0.85); }
  #btn-new {
    background: linear-gradient(135deg, #2a5020, #1a3514);
    border-color: #4a8040;
    color: #8ffa60;
  }
  #btn-flag {
    background: linear-gradient(135deg, #503020, #351a10);
    border-color: #80501a;
    color: #f0a040;
  }
  #btn-flag.active {
    background: linear-gradient(135deg, #804020, #602010);
    border-color: #f09020;
    color: #ffcc60;
    box-shadow: 0 0 8px #f0902060;
  }

  /* ── Overlay (win/lose) ── */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(3px);
  }
  #overlay.show { display: flex; }
  #overlay-box {
    background: linear-gradient(135deg, #1a0d00, #2d1800);
    border: 3px solid #6a3a10;
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    max-width: 280px;
  }
  #overlay-icon { font-size: 52px; margin-bottom: 10px; }
  #overlay-title { font-size: 26px; font-weight: bold; margin-bottom: 6px; }
  #overlay-sub   { font-size: 14px; color: #aaa; margin-bottom: 18px; }
  #overlay-score { font-size: 20px; margin-bottom: 20px; }
  #overlay-score span { color: #4cf; font-size: 28px; font-weight: bold; }
  #btn-retry {
    padding: 10px 32px;
    border-radius: 10px;
    border: 2px solid #4a8040;
    background: linear-gradient(135deg, #2a5020, #1a3514);
    color: #8ffa60;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #btn-retry:active { transform: scale(0.95); }


  /* ── Cell flash effects ── */
  .cell::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--flash-color, transparent);
    opacity: 0;
    pointer-events: none;
  }

  /* ── FX canvas (particle overlay) ── */
  #fx-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
    will-change: transform;
  }

  /* ── Screen flash (bomb hit) ── */
  #screen-flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 48;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="title">⛏️ DigDig</div>
    <div id="stats">
      <div class="stat">
        <div class="stat-label">スコア</div>
        <div class="stat-value" id="score-val">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">残機</div>
        <div class="stat-value" id="lives-val">❤️❤️❤️</div>
      </div>
      <div class="stat">
        <div class="stat-label">鉱石</div>
        <div class="stat-value" id="ores-val">0/0</div>
      </div>
    </div>
  </div>

  <div id="infobar">
    <div class="legend"><span class="legend-num leg-green">3</span><span>= 鉱石のみ</span></div>
    <div class="legend"><span class="legend-num leg-red">2</span><span>= 爆弾のみ</span></div>
    <div class="legend"><span class="legend-num leg-yellow">5</span><span>= 両方の合計</span></div>
  </div>

  <div id="grid-wrap">
    <div id="grid"></div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-flag">🚩 フラグ</button>
    <button class="btn" id="btn-new">🔄 新しいゲーム</button>
  </div>
</div>

<div id="overlay">
  <div id="overlay-box">
    <div id="overlay-icon"></div>
    <div id="overlay-title"></div>
    <div id="overlay-sub"></div>
    <div id="overlay-score">スコア: <span id="overlay-score-val">0</span></div>
    <button id="btn-retry">もう一度！</button>
  </div>
</div>

<canvas id="fx-canvas"></canvas>
<div id="screen-flash"></div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const COLS          = 10;
const ROWS          = 14;
const ORE_COUNT     = 12;
const BOMB_COUNT    = 14;
const MAX_LIVES     = 3;
const SCORE_ORE     = 100;
const SCORE_CELL    = 5;
const SAFE_ROWS_TOP = 1; // rows from top with no bombs

// ─── State ────────────────────────────────────────────────────────────────────
let cells       = [];   // {type, state, reachable, adjOre, adjBomb}
let lives       = MAX_LIVES;
let score       = 0;
let oresFound   = 0;
let oresTotal   = ORE_COUNT;
let flagMode    = false;
let gameOver    = false;

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const gridEl      = document.getElementById('grid');
const scoreEl     = document.getElementById('score-val');
const livesEl     = document.getElementById('lives-val');
const oresEl      = document.getElementById('ores-val');
const overlayEl   = document.getElementById('overlay');
const btnFlag     = document.getElementById('btn-flag');
const btnNew      = document.getElementById('btn-new');
const btnRetry    = document.getElementById('btn-retry');
const oIcon       = document.getElementById('overlay-icon');
const oTitle      = document.getElementById('overlay-title');
const oSub        = document.getElementById('overlay-sub');
const oScoreVal   = document.getElementById('overlay-score-val');

// ─── Init ─────────────────────────────────────────────────────────────────────
function initGame() {
  lives     = MAX_LIVES;
  score     = 0;
  oresFound = 0;
  flagMode  = false;
  gameOver  = false;

  btnFlag.classList.remove('active');
  overlayEl.classList.remove('show');

  cells = Array.from({ length: COLS * ROWS }, () => ({
    type:      'empty',   // 'empty' | 'ore' | 'bomb'
    state:     'hidden',  // 'hidden' | 'revealed' | 'flagged'
    reachable: false,
    adjOre:    0,
    adjBomb:   0,
  }));

  placeBombs();
  placeOres();
  calcAdjacency();

  // Reveal top row from the start, then unlock row 1 as reachable
  for (let c = 0; c < COLS; c++) {
    cells[c].state = 'revealed';
    neighbors(c).forEach(ni => {
      if (cells[ni].state === 'hidden') cells[ni].reachable = true;
    });
  }

  renderGrid();
  updateHUD();
}

function placeBombs() {
  // Bombs never in top SAFE_ROWS_TOP rows
  const safeUntil = SAFE_ROWS_TOP * COLS;
  let placed = 0;
  while (placed < BOMB_COUNT) {
    const idx = safeUntil + Math.floor(Math.random() * (COLS * ROWS - safeUntil));
    if (cells[idx].type === 'empty') {
      cells[idx].type = 'bomb';
      placed++;
    }
  }
}

function placeOres() {
  // Ores start from row 1 onwards (not surface row 0)
  const startIdx = COLS;
  let placed = 0;
  while (placed < ORE_COUNT) {
    const idx = startIdx + Math.floor(Math.random() * (COLS * ROWS - startIdx));
    if (cells[idx].type === 'empty') {
      cells[idx].type = 'ore';
      placed++;
    }
  }
}

function calcAdjacency() {
  for (let i = 0; i < COLS * ROWS; i++) {
    cells[i].adjOre  = 0;
    cells[i].adjBomb = 0;
    neighbors(i).forEach(ni => {
      if (cells[ni].type === 'ore')  cells[i].adjOre++;
      if (cells[ni].type === 'bomb') cells[i].adjBomb++;
    });
  }
}

function neighbors(idx) {
  const r = Math.floor(idx / COLS);
  const c = idx % COLS;
  const res = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS)
        res.push(nr * COLS + nc);
    }
  }
  return res;
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderGrid() {
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, var(--cell-size))`;
  gridEl.innerHTML = '';
  for (let i = 0; i < COLS * ROWS; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.dataset.idx = i;
    applyCell(el, i);
    gridEl.appendChild(el);
  }
}

function applyCell(el, i) {
  const c = cells[i];
  el.className = 'cell';
  el.textContent = '';

  if (c.state === 'hidden') {
    el.classList.add('hidden');
    if (c.reachable) el.classList.add('reachable');
  } else if (c.state === 'flagged') {
    el.classList.add('flagged');
    el.textContent = '🚩';
  } else {
    // revealed
    if (c.type === 'bomb') {
      el.classList.add('bomb-hit');
      el.textContent = '💣';
    } else if (c.type === 'ore') {
      el.classList.add('ore');
      el.textContent = oreEmoji(i);
    } else {
      el.classList.add('revealed');
      const total = c.adjOre + c.adjBomb;
      if (total > 0) {
        el.textContent = total;
        if (c.adjOre > 0 && c.adjBomb > 0) {
          el.classList.add('num-yellow');
        } else if (c.adjOre > 0) {
          el.classList.add('num-green');
        } else {
          el.classList.add('num-red');
        }
      }
    }
  }
}

function oreEmoji(i) {
  const gems = ['💎','🔷','🟢','💚','🔵'];
  return gems[i % gems.length];
}

function refreshCell(i) {
  const el = gridEl.children[i];
  if (el) applyCell(el, i);
}

function updateHUD() {
  scoreEl.textContent = score;
  const hearts = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
  livesEl.textContent = hearts || '💀';
  oresEl.textContent  = `${oresFound}/${oresTotal}`;
}

// ─── Input ────────────────────────────────────────────────────────────────────
// ─── Input ────────────────────────────────────────────────────────────────────
let pressTimer = null;
let _tapIdx = -1;
let _touchHandled = false;
let _pressAnim = null;

function animateCellPress(idx) {
  const el = gridEl.children[idx];
  const c = cells[idx];
  if (!el || !c || !c.reachable || c.state === 'revealed') return;
  _pressAnim = el.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(0.78)' }],
    { duration: 70, easing: SNAP, fill: 'forwards' }
  );
}

function animateCellRelease(idx) {
  if (!_pressAnim) return;
  _pressAnim.cancel();
  _pressAnim = null;
  const el = gridEl.children[idx];
  if (!el) return;
  el.animate(
    [{ transform: 'scale(0.78)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }],
    { duration: 160, easing: SPRING }
  );
}

gridEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.cell');
  if (!el || gameOver) return;
  _tapIdx = +el.dataset.idx;
  animateCellPress(_tapIdx);
  pressTimer = setTimeout(() => {
    animateCellRelease(_tapIdx);
    pressTimer = null;
    _tapIdx = -1;
    const idx = +el.dataset.idx;
    if (cells[idx].state !== 'revealed' && cells[idx].reachable) toggleFlag(idx);
  }, 450);
}, { passive: true });

gridEl.addEventListener('pointerup', e => {
  animateCellRelease(_tapIdx);
  if (e.pointerType === 'mouse') { _tapIdx = -1; return; }
  if (pressTimer !== null && _tapIdx >= 0) {
    clearTimeout(pressTimer);
    pressTimer = null;
    _touchHandled = true;
    handleTap(_tapIdx);
  }
  _tapIdx = -1;
}, { passive: true });

gridEl.addEventListener('pointermove', () => {
  if (pressTimer) {
    animateCellRelease(_tapIdx);
    clearTimeout(pressTimer);
    pressTimer = null;
    _tapIdx = -1;
  }
}, { passive: true });

// マウスクリック（touchはpointerupで処理済みのためスキップ）
gridEl.addEventListener('click', e => {
  if (_touchHandled) { _touchHandled = false; return; }
  const el = e.target.closest('.cell');
  if (!el || gameOver) return;
  handleTap(+el.dataset.idx);
});

btnFlag.addEventListener('click', () => {
  flagMode = !flagMode;
  btnFlag.classList.toggle('active', flagMode);
});

btnNew.addEventListener('click', initGame);
btnRetry.addEventListener('click', initGame);

function handleTap(idx) {
  const c = cells[idx];
  if (c.state === 'revealed') return;

  // Only reachable cells can be interacted with
  if (!c.reachable) return;

  if (flagMode) {
    toggleFlag(idx);
    return;
  }
  if (c.state === 'flagged') return; // must unflag first (or long-press)

  reveal(idx);
}

function toggleFlag(idx) {
  const c = cells[idx];
  if (c.state === 'hidden') {
    c.state = 'flagged';
    SFX.flag();
  } else if (c.state === 'flagged') {
    c.state = 'hidden';
    SFX.flag();
  }
  refreshCell(idx);
}

// ─── Reveal logic ─────────────────────────────────────────────────────────────
function reveal(idx) {
  const c = cells[idx];
  if (c.state !== 'hidden') return;

  if (c.type === 'bomb') {
    hitBomb(idx);
    return;
  }

  if (c.type === 'ore') {
    collectOre(idx);
    return;
  }

  // Empty cell — dig it and unlock neighbors
  c.state = 'revealed';
  score += SCORE_CELL;
  refreshCell(idx);
  // 掘った瞬間のポップ（既存アニメーションをキャンセルしてから開始）
  const digEl = gridEl.children[idx];
  digEl.getAnimations().forEach(a => a.cancel());
  digEl.animate(
    [{ transform: 'scale(0.8)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }],
    { duration: 160, easing: SPRING }
  );
  fxDig(idx);
  floatText(idx, `+${SCORE_CELL}`, '#8888ff');

  // Make all hidden neighbors reachable (no flood fill — player must tap each)
  unlockNeighbors(idx);

  updateHUD();
  checkWin();
}

function unlockNeighbors(idx) {
  neighbors(idx).forEach(ni => {
    if (cells[ni].state !== 'revealed' && !cells[ni].reachable) {
      cells[ni].reachable = true;
      refreshCell(ni);
    }
  });
}

function collectOre(idx) {
  const c = cells[idx];
  c.state = 'revealed';

  const el = gridEl.children[idx];
  el.className = 'cell collected';
  el.textContent = oreEmoji(idx);
  el.animate(
    [
      { transform: 'scale(1)',   opacity: '1', easing: 'ease-out' },
      { transform: 'scale(1.7)', opacity: '1', easing: 'ease-in'  },
      { transform: 'scale(0.3)', opacity: '0' }
    ],
    { duration: 220, fill: 'forwards' }
  );

  oresFound++;
  score += SCORE_ORE;

  setTimeout(() => {
    // fill:'forwards'のアニメーション状態を消してから見た目をリセット
    el.getAnimations().forEach(a => a.cancel());
    el.className = 'cell ore';
    el.textContent = oreEmoji(idx);
  }, 180);

  // Unlock neighbors when ore is collected
  unlockNeighbors(idx);

  fxOre(idx);
  floatText(idx, `+${SCORE_ORE}`, '#00ffaa');
  updateHUD();
  checkWin();
}

function hitBomb(idx) {
  const c = cells[idx];
  c.state = 'revealed';
  refreshCell(idx);
  gridEl.children[idx].animate(
    [
      { transform: 'scale(1)',    easing: 'ease-out'  },
      { transform: 'scale(1.7)', easing: SPRING       },
      { transform: 'scale(1.15)', easing: 'ease-in'   },
      { transform: 'scale(1)' }
    ],
    { duration: 350 }
  );

  // Unlock neighbors even on bomb hit (the hole is dug)
  unlockNeighbors(idx);

  fxBomb(idx);
  lives--;
  updateHUD();
  shakeGrid();

  if (lives <= 0) {
    setTimeout(() => endGame(false), 400);
  } else {
    floatText(idx, `💥 -1`, '#ff4400');
  }
}

function shakeGrid() {
  gridEl.animate([
    { transform: 'translateX(-4px)' },
    { transform: 'translateX(4px)' },
    { transform: 'translateX(-3px)' },
    { transform: 'translateX(3px)' },
    { transform: 'translateX(0)' },
  ], { duration: 150, easing: 'ease-out' });
}

function checkWin() {
  if (oresFound >= oresTotal) {
    setTimeout(() => endGame(true), 200);
  }
}

// ─── Game End ─────────────────────────────────────────────────────────────────
function endGame(won) {
  gameOver = true;

  if (!won) {
    // Reveal all bombs
    for (let i = 0; i < COLS * ROWS; i++) {
      if (cells[i].type === 'bomb' && cells[i].state === 'hidden') {
        cells[i].state = 'revealed';
        const el = gridEl.children[i];
        el.className = 'cell bomb-revealed';
        el.textContent = '💣';
      }
    }
  }

  if (won) SFX.win(); else SFX.lose();

  setTimeout(() => {
    oIcon.textContent       = won ? '🏆' : '💥';
    oTitle.textContent      = won ? 'クリア！' : 'ゲームオーバー';
    oSub.textContent        = won
      ? `全${oresTotal}個の鉱石を発掘した！`
      : `爆弾を踏みすぎた…`;
    oScoreVal.textContent   = score;
    oTitle.style.color      = won ? '#4fc' : '#f54';
    overlayEl.classList.add('show');
  }, won ? 250 : 500);
}

// ─── Cell position cache (避免 getBoundingClientRect on every dig) ──────────
// Grid CSS: border 3px, padding 4px, gap 2px → offset=7, stride=cellSize+2
let _cm = null;
window.addEventListener('resize', () => { _cm = null; });
function getCM() {
  if (_cm) return _cm;
  const cs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-size')) || 36;
  const gr = gridEl.getBoundingClientRect();
  const wr = document.getElementById('grid-wrap').getBoundingClientRect();
  return (_cm = { cs, gl: gr.left, gt: gr.top, wl: wr.left, wt: wr.top });
}

// ─── Float text → Workerに送信 ───────────────────────────────────────────────
function floatText(idx, text, color) {
  const { cs, gl, gt } = getCM();
  const col = idx % COLS, row = Math.floor(idx / COLS);
  fxWorker.postMessage({
    type: 'text',
    x: (gl + 7 + col * (cs + 2) + cs / 2) | 0,
    y: (gt + 7 + row * (cs + 2)) | 0,
    text, color,
  });
}

// ─── Audio (Web Audio API — procedural synthesis, no files needed) ───────────
const SFX = (() => {
  let ctx = null;
  const resume = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (freq, freq2, type, dur, vol, delay = 0, detune = 0) => {
    try {
      const c = resume(), t = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (freq2 !== freq) o.frequency.exponentialRampToValueAtTime(Math.max(freq2, 8), t + dur);
      if (detune) o.detune.setValueAtTime(detune, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  };
  const noise = (dur, vol, delay = 0, highpass = 0) => {
    try {
      const c = resume(), t = c.currentTime + delay;
      const len = Math.ceil(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(), g = c.createGain();
      src.buffer = buf;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (highpass) {
        const f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = highpass;
        src.connect(f); f.connect(g);
      } else {
        src.connect(g);
      }
      g.connect(c.destination);
      src.start(t); src.stop(t + dur);
    } catch (_) {}
  };
  return {
    // ドスッ + ザリっ : dirt crunch
    dig: () => {
      tone(220, 55, 'sawtooth', .09, .28);
      noise(.07, .18, 0, 600);
    },
    // チャリン + キラン : ore sparkle chime
    ore: () => {
      tone(880, 1320, 'sine', .14, .3);
      tone(1100, 1650, 'sine', .1, .2, .08);
      tone(660, 660, 'triangle', .06, .15, .18);
    },
    // ドカン : explosion
    bomb: () => {
      noise(.4, .65);
      tone(110, 28, 'sawtooth', .35, .45);
      tone(60, 20, 'square', .3, .25, .04);
    },
    // ファンファーレ : win
    win: () => {
      [[523,.18],[659,.12],[784,.12],[784,.12],[1047,.3]].reduce((d,[f,l]) => {
        tone(f, f, 'sine', l + .05, .25, d);
        return d + l;
      }, 0);
    },
    // ガーン : lose
    lose: () => {
      [[350,.15],[260,.15],[190,.15],[130,.25]].reduce((d,[f,l]) => {
        tone(f, f * .85, 'sawtooth', l + .05, .22, d);
        return d + l;
      }, 0);
    },
    // カチッ : flag
    flag: () => {
      tone(600, 380, 'square', .06, .14);
      noise(.04, .06, .01, 2000);
    },
  };
})();

// ─── Animation helpers ───────────────────────────────────────────────────────
const SPRING = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
const SNAP   = 'cubic-bezier(0.4, 0, 1, 1)';

// ─── Particle Worker (OffscreenCanvas) ───────────────────────────────────────
// パーティクル物理演算・描画をWorkerスレッドに移動してメインスレッドを解放
const WORKER_SRC = `
const MAX_P=96, STRIDE=8;
const pool=new Float32Array(MAX_P*STRIDE);
const PAL=['#8b4513','#6b3211','#a05a28','#c07030','#4a2008',
           '#00ffaa','#40ffcc','#00ee80','#aaffee','#ffff88',
           '#ff4400','#ff8800','#ffcc00','#ff2200','#ff6600'];
const textFloats=[];
let pCount=0, fxDirty=null, fxLastT=null, tickId=null, ctx=null;

self.onmessage = e => {
  const d=e.data;
  if (d.type==='init') {
    ctx=d.canvas.getContext('2d');
    ctx.canvas.width=d.w; ctx.canvas.height=d.h;
  } else if (d.type==='resize') {
    if(ctx){ctx.canvas.width=d.w;ctx.canvas.height=d.h;}
  } else if (d.type==='spawn') {
    for(let i=0;i<d.count&&pCount<MAX_P;i++,pCount++){
      const a=(i/d.count)*Math.PI*2+(Math.random()-.5);
      const spd=d.speed*(.5+Math.random()*.7);
      const o=pCount*STRIDE;
      pool[o]=d.ox;pool[o+1]=d.oy;
      pool[o+2]=Math.cos(a)*spd;pool[o+3]=Math.sin(a)*spd-d.speed*.2;
      pool[o+4]=d.size*(.5+Math.random()*.7);
      pool[o+5]=d.life;pool[o+6]=d.life;
      pool[o+7]=d.palStart+(i%d.palLen);
    }
    startLoop();
  } else if (d.type==='text') {
    textFloats.push({x:d.x,y:d.y,text:d.text,color:d.color,life:.4,maxLife:.4});
    startLoop();
  }
};

function startLoop(){if(!tickId&&ctx)tickId=setInterval(tick,15);}

function tick(){
  const now=performance.now();
  const dt=fxLastT?Math.min((now-fxLastT)/1000,.05):.016;
  fxLastT=now;
  if(fxDirty){ctx.clearRect(fxDirty.x,fxDirty.y,fxDirty.w,fxDirty.h);fxDirty=null;}
  let alive=0,x1=9999,y1=9999,x2=-9999,y2=-9999,lastCI=-1;
  for(let i=0;i<pCount;i++){
    const o=i*STRIDE;
    const life=pool[o+5]-dt;
    if(life<=0){pool[o+5]=0;continue;}
    pool[o+5]=life;alive++;
    pool[o+3]+=380*dt;pool[o+2]*=.92;
    pool[o]+=pool[o+2]*dt;pool[o+1]+=pool[o+3]*dt;
    const t=life/pool[o+6];
    const s=Math.max(1,(pool[o+4]*t)|0);
    const px=(pool[o]-s*.5)|0,py=(pool[o+1]-s*.5)|0;
    const ci=pool[o+7]|0;
    if(ci!==lastCI){ctx.fillStyle=PAL[ci];lastCI=ci;}
    ctx.fillRect(px,py,s,s);
    if(px<x1)x1=px;if(py<y1)y1=py;if(px+s>x2)x2=px+s;if(py+s>y2)y2=py+s;
  }
  if(textFloats.length>0){
    ctx.font='bold 14px "Arial Black",Arial,sans-serif';
    for(let i=textFloats.length-1;i>=0;i--){
      const f=textFloats[i];f.life-=dt;
      if(f.life<=0){textFloats.splice(i,1);continue;}
      alive++;
      const t=f.life/f.maxLife,fy=(f.y-(1-t)*28)|0;
      ctx.globalAlpha=t;ctx.fillStyle=f.color;
      ctx.fillText(f.text,f.x-20,fy);
      if(f.x-20<x1)x1=f.x-20;if(fy-16<y1)y1=fy-16;
      if(f.x+60>x2)x2=f.x+60;if(fy+4>y2)y2=fy+4;
    }
    ctx.globalAlpha=1;
  }
  if(alive>0){
    fxDirty={x:x1-1,y:y1-1,w:x2-x1+2,h:y2-y1+2};
  } else {
    if(x1<9999)ctx.clearRect(x1-1,y1-1,x2-x1+2,y2-y1+2);
    pCount=0;clearInterval(tickId);tickId=null;fxLastT=null;
  }
}
`;

const fxCanvas  = document.getElementById('fx-canvas');
const fxBlob    = new Blob([WORKER_SRC], { type: 'application/javascript' });
const fxWorker  = new Worker(URL.createObjectURL(fxBlob));
const offscreen = fxCanvas.transferControlToOffscreen();
fxWorker.postMessage({ type: 'init', canvas: offscreen, w: window.innerWidth, h: window.innerHeight }, [offscreen]);
window.addEventListener('resize', () => {
  fxWorker.postMessage({ type: 'resize', w: window.innerWidth, h: window.innerHeight });
});

// ─── Per-event FX ─────────────────────────────────────────────────────────────
function cellCenter(idx) {
  if (idx < 0 || idx >= COLS * ROWS) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const { cs, gl, gt } = getCM();
  const col = idx % COLS, row = Math.floor(idx / COLS);
  return { x: gl + 7 + col * (cs + 2) + cs / 2, y: gt + 7 + row * (cs + 2) + cs / 2 };
}

function flashCell(idx, cls) {
  const el = gridEl.children[idx];
  if (!el) return;
  const color = cls === 'flash-dig' ? '#fff' : cls === 'flash-ore' ? '#00ffcc' : '#ff6600';
  const dur   = cls === 'flash-dig' ? 120    : cls === 'flash-ore' ? 140       : 160;
  el.style.setProperty('--flash-color', color);
  el.animate([{ opacity: 0.85 }, { opacity: 0 }], { duration: dur, easing: 'ease-out', pseudoElement: '::before' });
}

function screenFlash(color) {
  const sf = document.getElementById('screen-flash');
  sf.style.background = color;
  sf.animate([{ opacity: 0.55 }, { opacity: 0 }], { duration: 200, easing: 'ease-out' });
}

function fxDig(idx) {
  const { x, y } = cellCenter(idx);
  flashCell(idx, 'flash-dig');
  fxWorker.postMessage({ type:'spawn', ox:x, oy:y, count:10, palStart:0,  palLen:5, size:8,  speed:220, life:.25 });
  SFX.dig();
}

function fxOre(idx) {
  const { x, y } = cellCenter(idx);
  flashCell(idx, 'flash-ore');
  fxWorker.postMessage({ type:'spawn', ox:x, oy:y, count:18, palStart:5,  palLen:5, size:9,  speed:280, life:.38 });
  SFX.ore();
}

function fxBomb(idx) {
  const { x, y } = cellCenter(idx);
  flashCell(idx, 'flash-bomb');
  screenFlash('#ff2200');
  fxWorker.postMessage({ type:'spawn', ox:x, oy:y, count:24, palStart:10, palLen:5, size:11, speed:320, life:.38 });
  SFX.bomb();
}

// ─── Responsive cell size ─────────────────────────────────────────────────────
function adjustCellSize() {
  const avW = Math.min(window.innerWidth, 420) - 24;  // padding
  const avH = window.innerHeight - 170; // header + controls + gaps
  const byW = Math.floor((avW - 10) / COLS) - 2;
  const byH = Math.floor((avH - 10) / ROWS) - 2;
  const size = Math.max(24, Math.min(byW, byH, 40));
  document.documentElement.style.setProperty('--cell-size', size + 'px');
  document.documentElement.style.setProperty('--border-radius', Math.max(2, Math.round(size / 10)) + 'px');
  // font size scales too
  gridEl.style.fontSize = Math.max(10, size - 14) + 'px';
}

window.addEventListener('resize', () => { adjustCellSize(); _cm = null; });

// ─── Start ────────────────────────────────────────────────────────────────────
adjustCellSize();
initGame();
</script>
